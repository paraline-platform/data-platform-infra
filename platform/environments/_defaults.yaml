# ============================================================
# ENVIRONMENTS/_DEFAULTS.YAML — Giá trị mặc định cho MỌI environment (P1.4)
# ============================================================
# Cách hoạt động: helmfile load file này TRƯỚC, sau đó environments/<env>.yaml
# merge đè lên (deep merge). Env file chỉ cần khai NHỮNG GÌ KHÁC defaults.
#
# Quy tắc:
#   - MỌI key mà values/env/*.gotmpl tham chiếu PHẢI có mặt ở đây
#     (helmfile render gotmpl với missingkey=error — thiếu key là vỡ render).
#     Kiểm tra: grep -rhoE '\.Values\.[a-zA-Z0-9_.]+' platform/values/env/
#   - Giá trị ở đây = "an toàn nhỏ" (dev-sized). Env lớn hơn tự override.
#   - global.* là danh tính env — env file BẮT BUỘC override.
# ============================================================

global:
  env: ""                    # BẮT BUỘC override trong environments/<env>.yaml
  domain: ""                 # BẮT BUỘC override
  cluster: ""                # BẮT BUỘC override
  ingress:
    enabled: false           # dev mặc định NodePort; uat/prod bật true

# ============================================================
# LAYER 02: STORAGE — MinIO
# ============================================================
minio:
  # standalone: 1 pod, không HA — OK cho dev/test
  # distributed: cần >= 4 pods, có erasure coding — chỉ dùng prod
  mode: standalone
  storage: 10Gi
  # NodePort: truy cập từ host qua localhost:<nodePort> (dev/kind)
  # ClusterIP: chỉ nội bộ cluster (uat/prod dùng Ingress)
  serviceType: NodePort
  nodePorts:
    api: 30900
    console: 30901
  auth:
    rootUser: admin
    rootPassword: ""                     # giá trị thật: environments/secrets/<env>.yaml (SOPS)
    useExistingSecret: false
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }
  metrics:
    enabled: false

# ============================================================
# LAYER 01: INGESTION — Kafka (Strimzi)
# ============================================================
kafka:
  replicas: 1          # dev: 1 broker. prod: 3 (HA)
  storage: 10Gi
  version: "4.1.0"     # Strimzi 0.51.0 hỗ trợ: 4.1.0, 4.1.1, 4.2.0
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }
  schemaRegistry:
    enabled: false     # key chết hiện tại (không gotmpl nào đọc) — giữ cho tương lai

# ============================================================
# LAYER 03: PROCESSING — Spark Operator
# ============================================================
spark:
  operator:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "200m", memory: "512Mi" }

# ============================================================
# LAYER 06: ORCHESTRATION — Airflow
# ============================================================
airflow:
  auth:
    adminPassword: ""        # giá trị thật: environments/secrets/<env>.yaml (SOPS)
    postgresPassword: ""     # giá trị thật: environments/secrets/<env>.yaml (SOPS)
  service:
    type: ClusterIP
  dags:
    storageClass: standard    # Kind default (local-path provisioner)
    storageSize: 2Gi
    accessMode: ReadWriteOnce
  gitSync:
    enabled: false            # TODO(P2.5): bật gitSync mọi env
    repo: ""
    branch: main
    period: "60s"
  resources:
    webserver:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    scheduler:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    triggerer:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    worker:    # default resource template cho KubernetesExecutor task pods
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# ============================================================
# LAYER 01: INGESTION — Debezium CDC
# ============================================================
debezium:
  connect:
    replicas: 1
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }
  demoPostgres:
    enabled: true    # false ở uat/prod → dùng existing DB
    password: ""                  # giá trị thật: environments/secrets/<env>.yaml (SOPS)
    debeziumUser: debezium
    debeziumPassword: ""          # giá trị thật: environments/secrets/<env>.yaml (SOPS)
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
  connector:
    enabled: true

# ============================================================
# LAYER 01: INGESTION — NiFi
# ============================================================
nifi:
  auth:
    username: admin
    # password tối thiểu 12 ký tự (yêu cầu NiFi singleUser auth)
    password: ""             # giá trị thật: environments/secrets/<env>.yaml (SOPS)
  properties:
    # webProxyHost phải khớp URL truy cập từ browser — sai → "Request not allowed for proxy"
    webProxyHost: "localhost:8443"
    sensitiveKey: ""         # giá trị thật: environments/secrets/<env>.yaml (SOPS)
  service:
    type: NodePort
    nodePort: 30800
  storage: 5Gi
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "3Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Hive Metastore (Iceberg Catalog)
# ============================================================
hms:
  postgres:
    password: ""             # giá trị thật: environments/secrets/<env>.yaml (SOPS)
    useExistingSecret: false
    existingSecret: hms-postgres-credentials
    storageSize: 5Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "250m", memory: "512Mi" }
  metastore:
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Spark Thrift Server (dbt SQL gateway)
# ============================================================
sparkThriftServer:
  sparkMaster: "local[2]"    # dev: 1 pod local mode. uat/prod: k8s:// + Dynamic Allocation
  replicas: 1
  dynamicAllocation:
    enabled: false
    minExecutors: 0
    maxExecutors: 0
    executorIdleTimeout: "60s"
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — dbt
# ============================================================
dbt:
  threads: 1
  schema: dbt_dev

# ============================================================
# LAYER 07: OBSERVABILITY — Prometheus + Grafana (TODO helmfile)
# ============================================================
monitoring:
  retention: 7d
  resources:
    prometheus:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }
    grafana:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "200m", memory: "256Mi" }
