# ============================================================
# ENVIRONMENTS/PROD.YAML — chỉ chứa những gì PROD KHÁC _defaults.yaml (P1.4)
# ============================================================
# Baseline: environments/_defaults.yaml (deep merge, file này đè lên).
# Để deploy: PROD_KUBE_CONTEXT=<context> ./scripts/deploy.sh prod
# ============================================================

global:
  env: prod
  domain: data-platform.company.com
  cluster: prod-k8s-cluster
  ingress:
    enabled: true

# --- MinIO: distributed HA, secret, metrics ---
minio:
  mode: distributed    # 4 pods, erasure coding, HA
  storage: 500Gi
  serviceType: ClusterIP
  nodePorts:
    api: null
    console: null
  auth:
    rootPassword: ""   # useExistingSecret: true
    # Tạo secret trước khi deploy:
    #   kubectl create secret generic minio-credentials \
    #     --from-literal=root-user=admin \
    #     --from-literal=root-password=<strong-random-password> \
    #     -n data-storage
    useExistingSecret: true
    existingSecret: minio-credentials
  resources:
    requests: { cpu: "2",  memory: "4Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }
  metrics:
    enabled: true

# --- Kafka: 3 brokers HA ---
kafka:
  replicas: 3          # chịu được 1 broker chết
  storage: 500Gi
  resources:
    requests: { cpu: "2",  memory: "4Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }
  schemaRegistry:
    enabled: true

# --- Spark Operator ---
spark:
  operator:
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }

# --- Airflow: secret, RWX storage, gitSync ---
airflow:
  auth:
    adminPassword: ""           # dùng K8s Secret
    postgresPassword: ""        # external managed DB
  dags:
    storageClass: efs-sc        # AWS EFS, GCP Filestore, hoặc NFS provisioner
    storageSize: 10Gi
    accessMode: ReadWriteMany   # RWX: mọi node mount được → HA
  gitSync:
    enabled: true
    repo: "https://github.com/your-org/data-platform-dags.git"   # TODO(P2.5): trỏ repo airflow thật
    branch: "main"
    period: "60s"
  resources:
    webserver:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    scheduler:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    triggerer:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    worker:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "2Gi" }

# --- Debezium: HA, không demo DB ---
debezium:
  connect:
    replicas: 2      # HA: tasks phân phối
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "2Gi" }
  demoPostgres:
    enabled: false   # prod: point vào existing DB
    password: ""
    debeziumPassword: ""   # dùng K8s Secret

# --- NiFi: ClusterIP + Ingress, secret ---
nifi:
  auth:
    password: ""   # dùng K8s Secret
  properties:
    # domain thật, không port (HTTPS qua Ingress 443)
    webProxyHost: "nifi.data-platform.company.com"
    sensitiveKey: ""   # dùng K8s Secret
  service:
    type: ClusterIP
    nodePort: null
  storage: 50Gi
  resources:
    requests: { cpu: "1",  memory: "2Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }

# --- HMS: secret + storage/resources prod ---
# Tạo secret trước khi deploy:
#   kubectl create secret generic hms-postgres-credentials \
#     --from-literal=password=<strong-random-password> -n data-modeling
hms:
  postgres:
    useExistingSecret: true
    existingSecret: hms-postgres-credentials
    storageSize: 50Gi
    storageClass: ""   # dùng default StorageClass của cluster
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }
  metastore:
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }

# --- Spark Thrift Server: k8s mode + Dynamic Allocation lớn ---
sparkThriftServer:
  sparkMaster: "k8s://https://kubernetes.default.svc:443"
  dynamicAllocation:
    enabled: true
    minExecutors: 0
    maxExecutors: 8
    executorIdleTimeout: "120s"
  resources:
    requests: { cpu: "1",   memory: "2Gi" }
    limits:   { cpu: "2",   memory: "4Gi" }

dbt:
  threads: 4
  schema: dbt_prod

# --- Observability ---
monitoring:
  retention: 90d
  resources:
    prometheus:
      requests: { cpu: "1",    memory: "4Gi" }
      limits:   { cpu: "2",    memory: "8Gi" }
    grafana:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
