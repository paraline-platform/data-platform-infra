# ============================================================
# ENVIRONMENTS/PROD.YAML — SINGLE SOURCE OF TRUTH cho môi trường PROD
# ============================================================
# Để deploy prod: ./scripts/deploy.sh prod
# ============================================================

global:
  env: prod
  domain: data-platform.company.com
  cluster: prod-k8s-cluster
  ingress:
    enabled: true

# ============================================================
# LAYER 02: STORAGE — MinIO
# ============================================================
minio:
  mode: distributed    # 4 pods, erasure coding, HA
  storage: 500Gi
  serviceType: ClusterIP
  nodePorts:           # Không dùng NodePort ở prod
    api: null
    console: null
  auth:
    rootUser: admin
    rootPassword: ""   # Không dùng — useExistingSecret: true
    # Tạo secret trước khi deploy:
    #   kubectl create secret generic minio-credentials \
    #     --from-literal=root-user=admin \
    #     --from-literal=root-password=<strong-random-password> \
    #     -n data-storage
    useExistingSecret: true
  resources:
    requests: { cpu: "2",  memory: "4Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }
  metrics:
    enabled: true

# ============================================================
# LAYER 01 + 03: MESSAGING — Kafka
# ============================================================
kafka:
  replicas: 3          # 3 brokers → chịu được 1 broker chết
  storage: 500Gi
  version: "4.1.0"   # Strimzi 0.51.0 hỗ trợ: 4.1.0, 4.1.1, 4.2.0
  resources:
    requests: { cpu: "2",  memory: "4Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }
  schemaRegistry:
    enabled: true

# ============================================================
# LAYER 03: PROCESSING — Spark
# ============================================================
spark:
  operator:
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }
  # Resource profiles cho Spark jobs: platform/spark-profiles/prod.yaml

# ============================================================
# LAYER 06: ORCHESTRATION — Airflow
# ============================================================
airflow:
  auth:
    adminPassword: ""           # dùng K8s Secret: kubectl create secret...
    postgresPassword: ""        # external managed DB, không dùng bundled postgres

  service:
    type: ClusterIP             # expose qua Ingress

  # Prod: RWX storage (EFS/NFS) → pods có thể chạy bất kỳ node nào (HA)
  dags:
    storageClass: efs-sc        # AWS EFS, GCP Filestore, hoặc NFS provisioner
    storageSize: 10Gi
    accessMode: ReadWriteMany   # RWX: tất cả nodes đều mount được → HA

  # gitSync từ git repo thực — dev team push DAG → Airflow tự pull
  gitSync:
    enabled: true
    repo: "https://github.com/your-org/data-platform-dags.git"
    branch: "main"
    period: "60s"

  resources:
    webserver:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    scheduler:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    triggerer:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    worker:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "2Gi" }

# ============================================================
# LAYER 01: INGESTION — Debezium CDC
# ============================================================
debezium:
  connect:
    replicas: 2      # HA: 2 replicas, tasks phân phối
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "2Gi" }
  demoPostgres:
    enabled: false   # Prod: point vào existing DB, không deploy demo
    password: ""
    debeziumUser: debezium
    debeziumPassword: ""   # dùng K8s Secret
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
  connector:
    enabled: true

# ============================================================
# LAYER 01: INGESTION — NiFi
# ============================================================
nifi:
  auth:
    username: admin
    password: ""   # dùng K8s Secret: kubectl create secret ...
  properties:
    # Prod: dùng domain thật (không có port vì HTTPS qua Ingress port 443)
    webProxyHost: "nifi.data-platform.company.com"
    sensitiveKey: ""   # dùng K8s Secret
  service:
    type: ClusterIP   # expose qua Ingress, không NodePort
    nodePort: null
  storage: 50Gi
  resources:
    requests: { cpu: "1",  memory: "2Gi" }
    limits:   { cpu: "4",  memory: "8Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Nessie (Iceberg Catalog)
# ============================================================
nessie:
  # ROCKSDB: persistent, single-node. Cần PVC.
  # Nâng cấp lên JDBC nếu cần HA (multi-replica + external Postgres)
  storage: rocksdb
  storageClass: ""     # dùng default StorageClass của cluster
  storageSize: 10Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

# ============================================================
# LAYER 07: OBSERVABILITY
# ============================================================
monitoring:
  retention: 90d
  resources:
    prometheus:
      requests: { cpu: "1",    memory: "4Gi" }
      limits:   { cpu: "2",    memory: "8Gi" }
    grafana:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

# ============================================================
# LAYER 05: DATA MODELING — Spark Thrift Server + dbt
# ============================================================
sparkThriftServer:
  sparkMaster: "k8s://https://kubernetes.default.svc:443"
  replicas: 1
  dynamicAllocation:
    enabled: true
    minExecutors: 0
    maxExecutors: 8
    executorIdleTimeout: "120s"
  resources:
    requests: { cpu: "1",   memory: "2Gi" }
    limits:   { cpu: "2",   memory: "4Gi" }

dbt:
  threads: 4
  schema: dbt_prod
