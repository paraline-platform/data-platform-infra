# ============================================================
# ENVIRONMENTS/DEV.YAML — chỉ chứa những gì DEV KHÁC _defaults.yaml (P1.4)
# ============================================================
# Baseline nằm ở environments/_defaults.yaml (helmfile merge defaults trước,
# file này đè lên sau). Dev vốn là baseline nên file này chỉ còn danh tính env.
#
# Để deploy: ./scripts/deploy.sh dev
# Muốn đổi tham số cho RIÊNG dev: thêm key vào đây (đè defaults).
# Muốn đổi tham số cho MỌI env: sửa _defaults.yaml.
# ============================================================

global:
  env: stg
  domain: data-platform.local        # Thêm vào /etc/hosts: 127.0.0.1 data-platform.local
  cluster: kind-data-platform
