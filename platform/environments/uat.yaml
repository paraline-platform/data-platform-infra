# ============================================================
# ENVIRONMENTS/UAT.YAML — chỉ chứa những gì UAT KHÁC _defaults.yaml (P1.4)
# ============================================================
# UAT: production-like nhưng nhỏ hơn — k8s:// mode với Dynamic Allocation.
# Baseline: environments/_defaults.yaml (deep merge, file này đè lên).
# Để deploy: UAT_KUBE_CONTEXT=<context> ./scripts/deploy.sh uat
# ============================================================

global:
  env: uat
  domain: data-platform-uat.company.com
  cluster: uat-k8s-cluster
  ingress:
    enabled: true

# --- MinIO: to hơn dev, ClusterIP + secret ---
minio:
  storage: 100Gi
  serviceType: ClusterIP
  nodePorts:
    api: null
    console: null
  auth:
    rootPassword: ""   # useExistingSecret: true
    useExistingSecret: true
    existingSecret: minio-credentials
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# --- Kafka: storage + resources lớn hơn dev ---
kafka:
  storage: 20Gi
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# --- Spark Operator ---
spark:
  operator:
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# --- Airflow: password qua K8s Secret, dags dùng default StorageClass ---
airflow:
  auth:
    adminPassword: ""      # dùng K8s Secret (P1-SOPS/P5 chuẩn hoá)
    postgresPassword: ""
  dags:
    storageClass: ""       # default StorageClass của cluster uat
    storageSize: 5Gi
  resources:
    webserver:
      requests: { cpu: "300m", memory: "768Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    scheduler:
      requests: { cpu: "300m", memory: "768Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    worker:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }

# --- Debezium: không deploy demo DB ---
debezium:
  demoPostgres:
    enabled: false
    password: ""
    debeziumPassword: ""

# --- NiFi: ClusterIP + secret, domain uat ---
nifi:
  auth:
    password: ""           # dùng K8s Secret
  properties:
    webProxyHost: "nifi.data-platform-uat.company.com"
    sensitiveKey: ""       # dùng K8s Secret
  service:
    type: ClusterIP
    nodePort: null
  storage: 10Gi
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "4Gi" }

# --- HMS: secret + storage/resources lớn hơn ---
hms:
  postgres:
    useExistingSecret: true
    existingSecret: hms-postgres-credentials    # kubectl create secret generic hms-postgres-credentials --from-literal=password=<strong-password> -n data-modeling
    storageSize: 20Gi
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }
  metastore:
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# --- Spark Thrift Server: k8s mode + Dynamic Allocation ---
sparkThriftServer:
  sparkMaster: "k8s://https://kubernetes.default.svc:443"
  dynamicAllocation:
    enabled: true
    minExecutors: 0
    maxExecutors: 2
    executorIdleTimeout: "60s"

dbt:
  threads: 2
  schema: dbt_uat
