# ============================================================
# ENVIRONMENTS/UAT.YAML — SINGLE SOURCE OF TRUTH cho môi trường UAT
# ============================================================
# UAT: production-like nhưng nhỏ hơn — dùng k8s:// mode với Dynamic Allocation
# Để deploy: ./scripts/deploy.sh uat
# ============================================================

global:
  env: uat
  domain: data-platform-uat.company.com
  cluster: uat-k8s-cluster
  ingress:
    enabled: true

# ============================================================
# LAYER 02: STORAGE — MinIO
# ============================================================
minio:
  mode: standalone
  storage: 100Gi
  serviceType: ClusterIP
  nodePorts:
    api: null
    console: null
  auth:
    rootUser: admin
    rootPassword: ""   # useExistingSecret: true
    useExistingSecret: true
    existingSecret: minio-credentials

# ============================================================
# LAYER 03: STREAM — Kafka
# ============================================================
kafka:
  replicaCount: 1
  storage: 20Gi
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Nessie (Iceberg Catalog)
# ============================================================
nessie:
  storage: rocksdb
  storageClass: ""
  storageSize: 5Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ============================================================
# LAYER 05: DATA MODELING — Spark Thrift Server + dbt
# ============================================================
sparkThriftServer:
  sparkMaster: "k8s://https://kubernetes.default.svc:443"
  replicas: 1
  dynamicAllocation:
    enabled: true
    minExecutors: 0
    maxExecutors: 2
    executorIdleTimeout: "60s"
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

dbt:
  threads: 2
  schema: dbt_uat
