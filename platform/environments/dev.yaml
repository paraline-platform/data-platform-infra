# ============================================================
# ENVIRONMENTS/DEV.YAML — SINGLE SOURCE OF TRUTH cho môi trường DEV
# ============================================================
# File này là NƠI DUY NHẤT bạn cần chỉnh khi muốn thay đổi
# bất kỳ tham số nào cho môi trường dev.
#
# Cách hoạt động:
#   1. Helmfile load file này vào biến .Values
#   2. values/env/*.yaml.gotmpl đọc .Values và sinh ra Helm chart values
#   3. Helm dùng chart values đó để deploy
#
# Để deploy: ./scripts/deploy.sh dev
# Để deploy chỉ 1 component: ./scripts/deploy.sh dev minio
# ============================================================

global:
  env: dev
  domain: data-platform.local        # Thêm vào /etc/hosts: 127.0.0.1 data-platform.local
  cluster: kind-data-platform
  # ingress.enabled: false → dùng NodePort thay Ingress (đơn giản hơn cho dev)
  # ingress.enabled: true  → cần cài ingress-nginx trước
  ingress:
    enabled: false

# ============================================================
# LAYER 02: STORAGE — MinIO
# ============================================================
minio:
  # standalone: 1 pod, không HA — OK cho dev/test
  # distributed: cần >= 4 pods, có erasure coding — chỉ dùng prod
  mode: standalone
  storage: 10Gi
  # NodePort: truy cập từ host qua localhost:<nodePort>
  # ClusterIP: chỉ dùng nội bộ cluster (prod dùng Ingress thay)
  serviceType: NodePort
  nodePorts:
    api: 30900       # MinIO S3 API — các app (Spark, Airflow) dùng port này
    console: 30901   # MinIO Web UI — truy cập browser tại localhost:30901
  auth:
    rootUser: admin
    rootPassword: "minio-dev-password"
    useExistingSecret: false   # true → prod dùng K8s Secret thay vì inline password
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }
  metrics:
    enabled: false   # Bật khi có Prometheus (M8)

# ============================================================
# LAYER 01 + 03: MESSAGING — Kafka (Strimzi)
# ============================================================
kafka:
  replicas: 1          # Dev: 1 broker. Prod: 3 brokers (HA)
  storage: 10Gi
  version: "4.1.0"   # Strimzi 0.51.0 hỗ trợ: 4.1.0, 4.1.1, 4.2.0
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }
  # Schema Registry: lưu Avro/Protobuf schemas cho Kafka topics
  schemaRegistry:
    enabled: false     # Bật khi cần strict schema management

# ============================================================
# LAYER 03: PROCESSING — Spark Operator
# ============================================================
spark:
  operator:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "200m", memory: "512Mi" }
  # Resource profiles cho Spark jobs: platform/spark-profiles/dev.yaml
  # Cách deploy job: ./scripts/run-spark-job.sh dev small spark-pi

# ============================================================
# LAYER 06: ORCHESTRATION — Airflow
# ============================================================
airflow:
  auth:
    adminPassword: "airflow-dev"        # UI login: admin / airflow-dev
    postgresPassword: "airflow-db-dev"  # internal postgres

  service:
    type: ClusterIP   # dùng: kubectl port-forward svc/airflow-webserver 8080:8080 -n data-orchestration

  # DAGs qua PVC — K8s tự schedule pods lên đúng node (không hardcode hostname)
  # local-path provisioner bind PVC vào node đầu → tất cả Airflow pods follow
  # Deploy DAG: ./scripts/deploy-dags.sh dev
  dags:
    storageClass: standard    # Kind default (local-path provisioner)
    storageSize: 2Gi
    accessMode: ReadWriteOnce # RWO đủ dùng vì local-path bind 1 node, pods cùng node mount được

  # gitSync tắt ở dev — bật ở prod với git repo thực
  gitSync:
    enabled: false

  resources:
    webserver:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    scheduler:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }
    triggerer:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    worker:    # default resource template cho KubernetesExecutor task pods
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# ============================================================
# LAYER 01: INGESTION — Debezium CDC
# ============================================================
debezium:
  connect:
    replicas: 1
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi" }
  demoPostgres:
    enabled: true    # false ở prod → dùng existing DB
    password: "postgres-dev-password"
    debeziumUser: debezium
    debeziumPassword: "debezium-dev-password"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
  connector:
    enabled: true

# ============================================================
# LAYER 01: INGESTION — NiFi
# ============================================================
nifi:
  auth:
    username: admin
    # password tối thiểu 12 ký tự (yêu cầu của NiFi singleUser auth)
    password: "nifi-dev-admin"
  properties:
    # webProxyHost: URL bạn dùng để truy cập NiFi từ browser
    # Phải khớp chính xác — sai → lỗi "Request not allowed for proxy"
    # Dev: NodePort 30800 → truy cập https://localhost:30800/nifi
    # Truy cập NiFi trên Kind cluster qua port-forward:
    #   kubectl port-forward svc/nifi 8443:8443 -n data-ingestion
    #   → mở https://localhost:8443/nifi
    # NodePort 30800 không hoạt động vì Kind Docker network không accessible từ macOS host
    webProxyHost: "localhost:8443"
    # sensitiveKey: dùng để encrypt credentials trong flow.xml (tối thiểu 12 ký tự)
    sensitiveKey: "nifi-dev-secret-key"
  service:
    type: NodePort
    nodePort: 30800
  storage: 5Gi     # PVC cho NiFi flow/content/logs
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "3Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Hive Metastore (Iceberg Catalog)
# ============================================================
# HMS thay thế Nessie làm Iceberg catalog.
# Catalog name trong Spark: "lakehouse" (spark.sql.defaultCatalog=lakehouse)
# Tất cả env dùng PostgreSQL backend — không có in-memory option.
#   Dev:  Postgres 5Gi PVC (nhỏ, dễ reset)
#   Prod: Postgres lớn hơn + useExistingSecret
hms:
  postgres:
    # Password HMS DB cho dev (inline — không dùng cho prod)
    password: "hms-dev-password"
    useExistingSecret: false
    storageSize: 5Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "250m", memory: "512Mi" }
  metastore:
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — Spark Thrift Server (dbt SQL gateway)
# ============================================================
# Thrift Server = HiveServer2-compatible Spark SQL server
# dbt kết nối qua: thrift://spark-thrift-server.data-modeling.svc:10000
# Catalog: lakehouse (Iceberg HiveCatalog → HMS thrift:9083 → Postgres)
#
# dev:  local[2] — tất cả chạy trong 1 pod, không cần executor pods
#       → đơn giản, khởi động nhanh (~90s), tiết kiệm tài nguyên
# uat:  k8s:// + Dynamic Allocation maxExecutors=2
# prod: k8s:// + Dynamic Allocation maxExecutors=8
sparkThriftServer:
  sparkMaster: "local[2]"
  replicas: 1
  dynamicAllocation:
    enabled: false
    minExecutors: 0
    maxExecutors: 0
    executorIdleTimeout: "60s"
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# ============================================================
# LAYER 04: LAKEHOUSE — dbt (data transformation)
# ============================================================
# dbt chạy như K8s Job, kết nối vào Spark Thrift Server
# Cách chạy: ./scripts/run-dbt.sh dev run
dbt:
  threads: 1           # dev: 1 model song song (đủ để test)
  schema: dbt_dev      # HMS schema: lakehouse.dbt_dev.*

# ============================================================
# LAYER 07: OBSERVABILITY — Prometheus + Grafana
# ============================================================
monitoring:
  retention: 7d        # Dev: 7 ngày. Prod: 30-90 ngày
  resources:
    prometheus:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }
    grafana:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "200m", memory: "256Mi" }
