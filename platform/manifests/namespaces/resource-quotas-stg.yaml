# ResourceQuota cho môi trường DEV
# Mục đích: giới hạn tổng tài nguyên mỗi namespace có thể dùng
# Quan trọng: nếu pod request vượt quota, pod sẽ KHÔNG được schedule (Pending)
#
# Cách tính: xem xét tổng RAM máy bạn, dành khoảng 60-70% cho cluster
# Ví dụ: máy 16GB RAM → cluster dùng ~10GB → chia đều cho các namespaces

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-ingestion
spec:
  hard:
    # Tăng từ 2→3 request, 4→8 limit để chứa thêm NiFi + Debezium sau này
    # Kafka+Strimzi: ~800m request / ~1900m limit
    # NiFi: ~260m request / ~2150m limit (main + log sidecar + init containers)
    # Debezium: ~300m request / ~1200m limit (connect + demo-postgres)
    # Tổng ước tính: ~1360m req / ~5250m limit → 3 req / 8 limit là an toàn
    requests.cpu: "3"
    requests.memory: "6Gi"
    limits.cpu: "8"
    limits.memory: "12Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-storage
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"
    persistentvolumeclaims: "5"

---
# data-processing: Spark driver + executor pods cần nhiều tài nguyên hơn
# Công thức: operator(0.2 CPU) + driver(N cores) + executor(M × N cores) < quota
# small profile: 0.2 + 1 + 1×1 = 2.2 CPU → cần ≥ 3
# medium profile: 0.2 + 2 + 2×2 = 6.2 CPU → cần ≥ 7
# → Đặt 8 CPU để hỗ trợ small + medium thoải mái
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-processing
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "30"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-modeling
spec:
  hard:
    # Nessie:        req 100m/256Mi,  lim 500m/512Mi
    # Thrift Server: req 500m/1Gi,    lim 1/2Gi
    # dbt Job:       req 200m/512Mi,  lim 500m/1Gi
    # Total:         req 800m/1.75Gi, lim 2/3.5Gi  → 2/4Gi safe headroom
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "6"
    limits.memory: "8Gi"
    pods: "20"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-governance
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "15"

---
# data-orchestration: Airflow cần nhiều quota cho task pods
# Công thức: webserver(200m) + scheduler(200m) + triggerer(100m) + postgres(100m)
#           + N task pods × 200m = base 600m + tasks
# → Đặt 6 CPU để chạy thoải mái ~20 concurrent tasks
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-orchestration
spec:
  hard:
    requests.cpu: "6"
    requests.memory: "12Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    pods: "40"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-observability
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "1"
    limits.memory: "2Gi"
    pods: "15"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: data-ai
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"