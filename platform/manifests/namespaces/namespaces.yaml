# Namespaces cho Data Lakehouse Platform
# Convention: mỗi layer có 1 namespace riêng
# Lý do:
#   - Resource isolation: quotas/limits riêng
#   - Security: RBAC policies riêng
#   - Maintainability: dễ xóa 1 layer mà không ảnh hưởng layer khác
#   - Monitoring: metrics rõ ràng theo layer

---
# Layer 01 + 03: Thu Thập & Xử Lý (Kafka dùng chung vì Debezium publish vào Kafka)
apiVersion: v1
kind: Namespace
metadata:
  name: data-ingestion
  labels:
    platform: data-lakehouse
    layer: "01-ingestion"
    # P1.7: Pod Security Standards — enforce baseline, warn restricted (xem gap truoc khi len restricted)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    environment: dev  # Sẽ được thay bằng Kustomize khi deploy

---
