# ============================================================
# BASE VALUES — Hive Metastore
# ============================================================
# Config tĩnh, không thay đổi theo môi trường
# Config động (resources, credentials) → values/env/hive-metastore.yaml.gotmpl

image:
  repository: apache/hive
  tag: "4.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9083

# PostgreSQL backend — DNS ổn định trong cluster
postgres:
  host: "hms-postgres-postgresql.data-modeling.svc.cluster.local"
  port: 5432
  database: metastore
  username: hive

# MinIO endpoint — DNS ổn định trong cluster
minio:
  endpoint: "http://minio.data-storage.svc.cluster.local:9000"
  warehouse: "s3a://warehouse/"

# JAR versions — khớp với spark-thrift-server để tránh class conflict
jars:
  postgresJdbcVersion: "42.7.3"
  hadoopAwsVersion: "3.3.4"
  awsSdkVersion: "1.12.587"
