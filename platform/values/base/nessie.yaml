# ============================================================
# NESSIE BASE VALUES — dùng chung mọi môi trường
# Chart: projectnessie/nessie v0.107.9
# Image: ghcr.io/projectnessie/nessie (GitHub Container Registry)
#
# Nessie = Iceberg Catalog với git-like branching
#   Spark/dbt kết nối qua REST API: http://nessie.data-modeling.svc:19120/api/v2
#   Không cần Hive Metastore — nhẹ hơn nhiều (~256Mi vs ~1Gi)
# ============================================================

image:
  repository: ghcr.io/projectnessie/nessie
  pullPolicy: IfNotPresent

replicaCount: 1

log:
  level: INFO
  console:
    enabled: true
    json: false

# Service: ClusterIP, port 19120 (Nessie default)
# Truy cập: kubectl port-forward svc/nessie 19120:19120 -n data-modeling
service:
  type: ClusterIP
  ports:
    - name: nessie-http
      number: 19120

ingress:
  enabled: false

# Tắt ServiceMonitor — bật khi có Prometheus (Layer 07)
serviceMonitor:
  enabled: false
