# ============================================================
# BASE VALUES — Spark Thrift Server
# ============================================================
# Config tĩnh, không thay đổi theo môi trường
# Config động (resources, credentials, master) → values/env/spark-thrift-server.yaml.gotmpl

image:
  repository: apache/spark
  tag: "3.5.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  thriftPort: 10000
  uiPort: 4040

# Nessie + MinIO service endpoints (DNS ổn định trong cluster, không thay theo env)
nessie:
  uri: "http://nessie.data-modeling.svc.cluster.local:19120/api/v2"
  ref: "main"
  warehouse: "s3a://warehouse/"

minio:
  endpoint: "http://minio.data-storage.svc.cluster.local:9000"

# JAR versions — cập nhật ở đây khi cần upgrade
jars:
  icebergVersion: "1.6.1"
  hadoopAwsVersion: "3.3.4"
  awsSdkVersion: "1.12.587"

# Executor spec cho k8s mode (dev local[2] không dùng)
executor:
  cores: 1
  memory: "1g"
