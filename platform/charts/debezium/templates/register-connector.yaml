{{- if .Values.connector.enabled }}
# ============================================================
# REGISTER CONNECTOR — Kubernetes Job (post-deploy)
#
# Tại sao dùng Job thay vì KafkaConnector CRD?
#   KafkaConnector CRD chỉ hoạt động với Strimzi KafkaConnect (không phải plain Deployment)
#   Job đơn giản hơn: curl POST vào REST API, idempotent, dễ debug
#
# ConfigMap connector-config: lưu connector JSON config
#   Thay đổi config → sửa ConfigMap → helmfile apply → Job re-register
#   Version-controlled trong Git, không cần nhớ curl command
#
# Idempotent:
#   Connector chưa tồn tại → POST (tạo mới)
#   Connector đã tồn tại   → PUT config (update)
#   Có thể chạy nhiều lần mà không gây lỗi
#
# helm.sh/hook: post-install,post-upgrade
#   Job chạy sau khi Helm apply thành công
#   Đợi Connect REST API ready trước khi register
# ============================================================

---
# ConnectorConfig: lưu Debezium connector config dưới dạng JSON
# Dễ đọc, dễ sửa, tracked trong Git
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: debezium-connect
data:
  connector.json: |
    {
      "name": {{ .Values.connector.name | quote }},
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "demo-postgres.{{ .Release.Namespace }}.svc.cluster.local",
        "database.port": "5432",
        "database.user": {{ .Values.demoPostgres.debeziumUser | quote }},
        "database.password": {{ .Values.demoPostgres.debeziumPassword | quote }},
        "database.dbname": {{ .Values.demoPostgres.database | quote }},
        "topic.prefix": {{ .Values.connector.topicPrefix | quote }},
        "table.include.list": {{ .Values.connector.tableInclude | quote }},
        "plugin.name": "pgoutput",
        "publication.name": "debezium_pub",
        "slot.name": "debezium_slot",
        "snapshot.mode": {{ .Values.connector.snapshotMode | quote }},
        "heartbeat.interval.ms": "10000",
        "transforms": "unwrap",
        "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
        "transforms.unwrap.drop.tombstones": "false",
        "transforms.unwrap.delete.handling.mode": "rewrite",
        "transforms.unwrap.add.fields": "op,ts_ms"
      }
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-connector
  namespace: {{ .Release.Namespace }}
  labels:
    app: debezium-connect
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Đợi Debezium Connect REST API ready trước khi register
        - name: wait-for-connect
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Debezium Connect REST API..."
              until curl -sf http://debezium-connect.{{ .Release.Namespace }}.svc:8083/connectors; do
                echo "Not ready, retrying in 10s..."
                sleep 10
              done
              echo "Connect is ready!"
      containers:
        - name: register
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              CONNECT_URL="http://debezium-connect.{{ .Release.Namespace }}.svc:8083"
              CONNECTOR="{{ .Values.connector.name }}"

              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                "${CONNECT_URL}/connectors/${CONNECTOR}" 2>/dev/null || echo "000")

              if [ "$STATUS" = "200" ]; then
                echo "Connector exists → updating config..."
                curl -sf -X PUT \
                  -H "Content-Type: application/json" \
                  -d "$(cat /config/connector.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d["config"]))')" \
                  "${CONNECT_URL}/connectors/${CONNECTOR}/config"
              else
                echo "Registering new connector..."
                curl -sf -X POST \
                  -H "Content-Type: application/json" \
                  -d @/config/connector.json \
                  "${CONNECT_URL}/connectors"
              fi

              echo ""
              echo "Final status:"
              curl -sf "${CONNECT_URL}/connectors/${CONNECTOR}/status"
          volumeMounts:
            - name: connector-config
              mountPath: /config
      volumes:
        - name: connector-config
          configMap:
            name: connector-config
{{- end }}
