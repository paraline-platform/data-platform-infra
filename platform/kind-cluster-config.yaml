# File YAML này là cấu hình để Kind tạo một Kubernetes cluster local tên data-platform
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: data-platform # Cluster Name. Sau khi tạo xong, context kubectl thường sẽ là: kind-data-platform

nodes:
  # Trong Kind, mỗi Kubernetes node thực chất là một Docker container
  # Node Control Plane: chạy K8s system components (API server, scheduler...). Node chạy các thành phần điều khiển chính của Kubernetes
  - role: control-plane
    # extraPortMappings: map port từ máy host → container kind
    # Mục đích: access các UI/service từ browser trên máy bạn
    # Vì Kind node là Docker container, nên muốn truy cập service trong cluster từ máy host/browser, bạn cần map port từ container node ra máy host
    extraPortMappings:
      - containerPort: 80    # Ingress HTTP
        hostPort: 80
        protocol: TCP
      - containerPort: 443   # Ingress HTTPS
        hostPort: 443
        protocol: TCP
      - containerPort: 30080 # NodePort fallback (dự phòng) (nếu ingress chưa setup)
        hostPort: 30080
        protocol: TCP
    # kubeadmConfigPatches: inject config vào kubeadm khi khởi tạo cluster
    kubeadmConfigPatches: # Phần này inject thêm cấu hình vào quá trình Kind dùng kubeadm để khởi tạo Kubernetes node
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # Tắt swap check — không cần thiết trong dev
            node-labels: "ingress-ready=true" # Label này thường dùng khi cài Ingress NGINX cho Kind
            # Ingress Controller có thể được cấu hình chỉ chạy trên node có label
            # Vì trong file này chỉ control-plane node có port mapping 80/443 ra host, nên Ingress Controller nên chạy trên control-plane node.
            # Nếu Ingress Controller chạy nhầm sang worker node, port 80/443 có thể không truy cập được từ máy host.

  # Node Worker 1: chạy application pods
  - role: worker
    # extraMounts: mount thư mục từ host vào node
    # Dùng cho Local Persistent Volumes (lưu data của MinIO, Kafka, Postgres...)
    # Phần này mount thư mục từ máy host vào Kind node container
    extraMounts: # chỉ mount thư mục vào Kind node, nó chưa tự động tạo PV/PVC
      - hostPath: /tmp/data-platform/worker1 # Trên máy Mac/Linux của bạn
        containerPath: /data # sẽ được mount vào trong Kind worker node tại /data
        readOnly: false

  # Node Worker 2: thêm capacity, tách workloads nặng
  - role: worker
    extraMounts:
      - hostPath: /tmp/data-platform/worker2
        containerPath: /data
        readOnly: false

# Networking config
networking:
  # Pod IP là IP nội bộ trong Kubernetes cluster
  # podSubnet: dải IP cho pods (mặc định là 10.244.0.0/16)
  podSubnet: "10.244.0.0/16"
  # serviceSubnet: dải IP cho services
  serviceSubnet: "10.96.0.0/12"
  # disableDefaultCNI: false = dùng kindnet (default), true = tự cài CNI
  disableDefaultCNI: false