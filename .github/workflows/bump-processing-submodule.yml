# ============================================================
# BUMP-PROCESSING-SUBMODULE.YML
# ============================================================
# Mục đích: Khi infra repo có push mới lên stg/uat/prd,
# tự động cập nhật submodule pointer trong data-platform-processing
# (cùng branch) để trỏ đến SHA mới nhất của infra.
#
# Cơ chế (không cần fetch infra repo lần 2):
#   - ${{ github.sha }} = SHA infra commit đã trigger workflow này
#   - git update-index --cacheinfo 160000,<sha>,platform
#     → ghi thẳng gitlink vào index của processing repo
#   - Không cần git submodule update --init (tránh auth issue)
#   - Không cần network call thứ 2 vào infra repo
#
# Yêu cầu secret:
#   PLATFORM_PAT = Fine-grained PAT với "Contents: write" trên
#   data-platform-processing repo (xem docs/notes/03-submodule-strategy.md)
#
# Anti-loop:
#   - Commit message có "[skip ci]" → processing CI không chạy lại
#   - paths-ignore: .github/** → workflow tự thân không trigger lại
# ============================================================

name: Bump processing submodule

on:
  push:
    branches: [stg, uat, prd]
    paths-ignore:
      - '.github/**'

jobs:
  bump-submodule:
    name: Bump platform submodule in processing (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # Checkout processing repo (không cần submodule)
      - name: Checkout data-platform-processing
        uses: actions/checkout@v4
        with:
          repository: tungnt763/data-platform-processing
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PLATFORM_PAT }}
          submodules: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update gitlink và commit (nếu có thay đổi)
        env:
          INFRA_SHA: ${{ github.sha }}
          INFRA_BRANCH: ${{ github.ref_name }}
          INFRA_MSG: ${{ github.event.head_commit.message }}
        run: |
          INFRA_SHA_SHORT="${INFRA_SHA:0:7}"

          # Cập nhật gitlink trong index:
          #   160000 = mode của submodule (gitlink)
          #   platform = path của submodule trong processing repo
          # Không cần fetch infra repo — sha đã biết từ event trigger
          git update-index --cacheinfo "160000,${INFRA_SHA},platform"

          # Chỉ commit nếu sha thực sự thay đổi so với HEAD
          if git diff --cached --quiet; then
            echo "✓ Submodule đã up-to-date (${INFRA_SHA_SHORT}). Skip."
            exit 0
          fi

          git commit -m "chore(submodule): bump platform → infra/${INFRA_BRANCH}@${INFRA_SHA_SHORT} [skip ci]

Infra commit: ${INFRA_SHA}
Triggered by: ${INFRA_MSG}"

          git push origin "${INFRA_BRANCH}"
          echo "✓ Bumped: platform → ${INFRA_SHA_SHORT} on ${INFRA_BRANCH}"
