# ============================================================
# SYNC-BRANCHES — Chống conflict bằng forward-merge tự động
#
# Cách hoạt động:
#   Sau mỗi merge vào stg → tự động tạo PR "stg → uat"
#   Sau mỗi merge vào uat → tự động tạo PR "uat → prd"
#
# Tại sao cần?
#   Nếu không sync, uat có thể bị diverge với stg khi ai đó
#   merge hotfix trực tiếp vào stg. PR tự động nhắc nhở và
#   thực hiện forward-merge trước khi uat/prd bị stale.
#
# Lưu ý: PR được tạo tự động, người dùng vẫn phải REVIEW và MERGE.
# ============================================================
name: Sync Branches (Forward Promote)

on:
  push:
    branches:
      - stg   # merge vào stg → đề xuất sync lên uat
      - uat   # merge vào uat → đề xuất sync lên prd

jobs:
  create-promotion-pr:
    name: Create promotion PR (${{ github.ref_name }} → next)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần full history để check diverge

      - name: Determine source and target
        id: branches
        run: |
          if [[ "${{ github.ref_name }}" == "stg" ]]; then
            echo "source=stg" >> $GITHUB_OUTPUT
            echo "target=uat" >> $GITHUB_OUTPUT
            echo "env_label=UAT" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "uat" ]]; then
            echo "source=uat" >> $GITHUB_OUTPUT
            echo "target=prd" >> $GITHUB_OUTPUT
            echo "env_label=PRODUCTION" >> $GITHUB_OUTPUT
          fi

      - name: Check if branches have diverged
        id: check
        run: |
          SOURCE=${{ steps.branches.outputs.source }}
          TARGET=${{ steps.branches.outputs.target }}

          git fetch origin $SOURCE $TARGET

          # Commits trong source chưa có trong target (cần promote)
          AHEAD=$(git log origin/$TARGET..origin/$SOURCE --oneline | wc -l | tr -d ' ')
          # Commits trong target không có trong source (diverged — nguy hiểm!)
          BEHIND=$(git log origin/$SOURCE..origin/$TARGET --oneline | wc -l | tr -d ' ')

          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "source=$SOURCE, target=$TARGET"
          echo "  $TARGET is $AHEAD commits BEHIND $SOURCE (need to promote)"
          echo "  $TARGET is $BEHIND commits AHEAD of $SOURCE (diverged if >0)"

          if [[ "$BEHIND" -gt 0 ]]; then
            echo "⚠️  WARNING: $TARGET has $BEHIND commits not in $SOURCE!"
            echo "   This means $TARGET diverged — manual review required."
          fi

      - name: Create or update promotion PR
        if: steps.check.outputs.ahead > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE=${{ steps.branches.outputs.source }}
          TARGET=${{ steps.branches.outputs.target }}
          ENV_LABEL=${{ steps.branches.outputs.env_label }}
          AHEAD=${{ steps.check.outputs.ahead }}
          BEHIND=${{ steps.check.outputs.behind }}
          SHA_SHORT=$(git rev-parse --short origin/$SOURCE)

          # Tiêu đề PR
          PR_TITLE="promote($SOURCE→$TARGET): $AHEAD commits — $SHA_SHORT"

          # Body PR với thông tin diverge
          if [[ "$BEHIND" -gt 0 ]]; then
            DIVERGE_WARNING="⚠️ **WARNING: \`$TARGET\` has $BEHIND commits not in \`$SOURCE\`!**
          > Branches have diverged. Manual merge conflict resolution may be required.
          > Run: \`git log origin/$SOURCE..origin/$TARGET --oneline\` to see the commits."
          else
            DIVERGE_WARNING="✅ No divergence — clean forward-merge."
          fi

          PR_BODY="## Promote \`$SOURCE\` → \`$TARGET\` ($ENV_LABEL)

          **$AHEAD commits** ready to promote.

          $DIVERGE_WARNING

          ### Anti-conflict checklist
          - [ ] CI trên \`$SOURCE\` xanh hoàn toàn
          - [ ] Argo CD sync thành công ở \`$SOURCE\` environment
          - [ ] Smoke test pass ở \`$SOURCE\` environment
          - [ ] Không có open PR nào trên \`$SOURCE\` chưa merge

          ### Merge strategy
          Dùng **\"Create a merge commit\"** (không squash) để giữ traceability.

          ---
          *Auto-generated by sync-branches.yml after push to \`$SOURCE\`*"

          # Tạo PR nếu chưa có, hoặc update nếu đã có
          EXISTING_PR=$(gh pr list \
            --base "$TARGET" \
            --head "$SOURCE" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            echo "Creating new promotion PR"
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base "$TARGET" \
              --head "$SOURCE" \
              --label "promotion" 2>/dev/null || \
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base "$TARGET" \
              --head "$SOURCE"
          fi

      - name: Skip — branches in sync
        if: steps.check.outputs.ahead == 0
        run: echo "✓ ${{ steps.branches.outputs.target }} is already up-to-date with ${{ steps.branches.outputs.source }}. No PR needed."
