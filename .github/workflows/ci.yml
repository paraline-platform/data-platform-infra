# ============================================================
# CI — data-platform-infra
#
# Trigger: push hoặc PR vào stg / uat / prd
#
# Branch → Environment mapping:
#   stg  → dev   cluster  (fast feedback, validate all)
#   uat  → uat   cluster  (same as stg + helmfile uat env check)
#   prd  → prod  cluster  (strict: enforce_admins, linear history)
#
# Không deploy — chỉ validate. Deploy do Argo CD (Phase 4).
#
# Jobs:
#   1. helm-lint          : Lint custom Helm charts
#   2. validate-k8s       : kubeconform validate manifests
#   3. helmfile-template  : Render helmfile env tương ứng với branch
# ============================================================
name: CI

on:
  push:
    branches: [stg, uat, prd]
  pull_request:
    branches: [stg, uat, prd]

# P1.5: bỏ map branch→env — job helmfile-template render matrix CẢ 3 env
jobs:
  # ----------------------------------------------------------
  # JOB 1: Lint Helm charts — chạy trên mọi branch
  # ----------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      - name: Lint all custom charts
        run: |
          for chart in platform/charts/*/; do
            echo "--- $chart ---"
            helm lint "$chart"
          done
          echo "✓ All charts passed"

  # ----------------------------------------------------------
  # JOB 2: Validate raw K8s manifests
  # ----------------------------------------------------------
  validate-k8s:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests
        run: |
          find platform/manifests -name "*.yaml" | xargs kubeconform \
            -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -summary
          echo "✓ Manifests valid"

  # ----------------------------------------------------------
  # JOB 3: Render helmfile — P1.5: matrix CẢ 3 env trên mọi PR/push
  # Lý do: một thay đổi gotmpl có thể vỡ prod mà không vỡ dev —
  # phát hiện lúc PR rẻ hơn vô hạn so với lúc promote.
  # Cần secret SOPS_AGE_KEY (nội dung age keys.txt) để giải mã
  # environments/secrets/*.yaml — thiếu secret này job sẽ fail.
  # ----------------------------------------------------------
  helmfile-template:
    name: Helmfile Template (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, uat, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      - name: Install helmfile + sops + helm-secrets
        run: |
          curl -sSL https://github.com/helmfile/helmfile/releases/download/v0.171.0/helmfile_0.171.0_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin
          sudo curl -sSLo /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          helm plugin install https://github.com/jkroepke/helm-secrets

      - name: Setup age key (giải mã SOPS)
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt

      # KHÔNG có "|| true": thiếu repo phải làm CI đỏ (P0.1 từng bị che bởi lệnh này)
      - name: Add Helm repos
        run: helmfile -f platform/helmfile.yaml.gotmpl repos

      # KHÔNG có continue-on-error: render fail = CI đỏ = không merge được.
      # Không pipe qua tail để giữ nguyên exit code + full log lỗi.
      - name: Render helmfile (${{ matrix.env }})
        run: |
          helmfile -e ${{ matrix.env }} -f platform/helmfile.yaml.gotmpl template --skip-deps > /dev/null
          echo "✓ Helmfile template passed (${{ matrix.env }})"
